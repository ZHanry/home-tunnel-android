// Android owns the universal package matrix. Flutter debug builds also resolve
// x86 engines, but only these two ABIs have the matching HomeDesk native core.
gradle.beforeProject { project ->
    project.pluginManager.withPlugin('com.android.application') {
        def android = project.extensions.getByName('android')
        android.defaultConfig.ndk.abiFilters.clear()
        android.defaultConfig.ndk.abiFilters.addAll(['arm64-v8a', 'x86_64'])
    }
}
