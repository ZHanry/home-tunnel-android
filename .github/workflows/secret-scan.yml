name: Secret scan
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  merge_group: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Scan the exact shared source snapshot
      run: |
        curl --fail --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
        tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
        python3 homedesk-core/build/ci/scan-secrets.py --gitleaks "$RUNNER_TEMP/gitleaks"
    - name: Scan the exact shared source snapshot
      run: |
        curl --fail --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
        tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
        python3 homedesk-core/build/ci/scan-secrets.py --gitleaks "$RUNNER_TEMP/gitleaks"
