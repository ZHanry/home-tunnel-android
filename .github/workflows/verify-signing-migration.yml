name: Verify migrated Android signing identity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.actor == 'ZHanry'
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify certificate continuity and private-key usability
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/migration-check.p12"
          certificate="$RUNNER_TEMP/migration-check.der"
          request="$RUNNER_TEMP/migration-check.csr"
          trap 'rm -f -- "$keystore" "$certificate" "$request"' EXIT
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          keytool -exportcert -keystore "$keystore" -alias "$ANDROID_RELEASE_KEY_ALIAS" \
            -storepass:env ANDROID_RELEASE_STORE_PASSWORD -file "$certificate"
          actual=$(sha256sum "$certificate" | cut -d' ' -f1)
          expected=$(tr -d '[:space:]:' < release-signing-cert.sha256 | tr 'A-F' 'a-f')
          test "$actual" = "$expected"
          keytool -certreq -keystore "$keystore" -alias "$ANDROID_RELEASE_KEY_ALIAS" \
            -storepass:env ANDROID_RELEASE_STORE_PASSWORD -keypass:env ANDROID_RELEASE_KEY_PASSWORD \
            -file "$request"
          test -s "$request"
          printf 'Persistent Android certificate verified: %s\n' "$actual"
