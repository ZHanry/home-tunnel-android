name: CodeQL
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze current Android source (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language:
        - java-kotlin
        - c-cpp
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        config-file: .github/codeql-homedesk.yml
    - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
      with:
        category: /language:${{ matrix.language }}/target:homedesk
        wait-for-processing: true
    - env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/check-codeql-alerts.py
