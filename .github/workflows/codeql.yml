name: CodeQL
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2
jobs:
  analyze:
    name: Analyze current Android source (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - language: java-kotlin
          mode: manual
        - language: c-cpp
          mode: none
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        fetch-depth: 0
    - if: matrix.language == 'java-kotlin'
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: 1.96.0
    - if: matrix.language == 'java-kotlin'
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: 3.24.5
        cache: true
    - if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - if: matrix.language == 'java-kotlin'
      name: Configure the current Flutter Android project
      run: |
        bash scripts/setup-homedesk-sdk.sh
        cd homedesk-core/client/flutter
        flutter pub get --enforce-lockfile
        printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
    - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.mode }}
        config-file: .github/codeql-homedesk.yml
    - if: matrix.language == 'java-kotlin'
      name: Extract the actual Kotlin app through its compiler
      working-directory: homedesk-core/client/flutter/android
      run: ./gradlew --no-daemon :app:compileDebugKotlin -x :app:compileFlutterBuildDebug
    - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
      with:
        category: /language:${{ matrix.language }}/target:homedesk
        wait-for-processing: true
    - env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/check-codeql-alerts.py
