name: Android CI
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
env:
  CARGO_HTTP_MULTIPLEXING: 'false'
  # A clean universal Flutter engine restore exceeds Gradle's upstream 1 GB heap.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bridge:
    name: Generate exact shared Rust/Flutter bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HOMEDESK_CONFIG_PATH: ${{ github.workspace }}/homedesk-core/build/config.toml.example
      RUST_LOG: info
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: 1.96.0
        components: rustfmt
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: 3.24.5
        cache: true
    - name: Install bridge tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libclang-dev libgtk-3-dev ninja-build nasm cmake pkg-config
        cargo install cargo-expand --version 1.0.95 --locked
        cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
        cd homedesk-core/client/flutter
        flutter pub get --enforce-lockfile
        cd ..
        flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: homedesk-bridge
        path: |-
          homedesk-core/client/src/bridge_generated*.rs
          homedesk-core/client/flutter/lib/generated_bridge*.dart
          homedesk-core/client/flutter/macos/Runner/bridge_generated.h
        if-no-files-found: error
  native:
    name: Build native P2P (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    needs: bridge
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
        - abi: arm64-v8a
          target: aarch64-linux-android
          sysroot: aarch64-linux-android
          features: flutter,hwcodec
        - abi: x86_64
          target: x86_64-linux-android
          sysroot: x86_64-linux-android
          features: flutter
    env:
      HOMEDESK_CONFIG_PATH: ${{ github.workspace }}/homedesk-core/build/config.toml.example
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: 1.96.0
        components: rustfmt
        targets: ${{ matrix.target }}
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: 3.24.5
        cache: true
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - name: Install pinned Android SDK/NDK
      run: |
        bash scripts/setup-homedesk-sdk.sh
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |-
          ~/.cargo/registry
          ~/.cargo/git
          homedesk-core/client/target
        key: android-rust-1.96-${{ matrix.target }}-${{ hashFiles('homedesk-core/client/Cargo.lock')
          }}
        restore-keys: android-rust-1.96-${{ matrix.target }}-
    - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: ${{ runner.temp }}/vcpkg
        vcpkgGitCommitId: 120deac3062162151622ca4860575a33844ba10b
        vcpkgJsonGlob: homedesk-core/client/vcpkg.json
        doNotCache: true
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: homedesk-bridge
        path: homedesk-core/client
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      id: native-deps
      with:
        path: |-
          ${{ runner.temp }}/vcpkg/installed
          ${{ runner.temp }}/vcpkg/buildtrees
          ${{ runner.temp }}/vcpkg/downloads
        key: homedesk-android-native-source-ndk27-120deac-${{ matrix.abi }}-${{ hashFiles('homedesk-core/client/vcpkg.json', 'homedesk-core/client/res/vcpkg/**') }}
    - name: Build locked dependencies with corresponding source
      env:
        ABI: ${{ matrix.abi }}
        # Binary-only cache entries do not retain the actual patched sources.
        VCPKG_BINARY_SOURCES: clear
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libclang-dev nasm ninja-build cmake pkg-config
        cd homedesk-core/client
        bash flutter/build_android_deps.sh "$ABI"
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      if: ${{ steps.native-deps.outputs.cache-hit != 'true' }}
      with:
        path: |-
          ${{ runner.temp }}/vcpkg/installed
          ${{ runner.temp }}/vcpkg/buildtrees
          ${{ runner.temp }}/vcpkg/downloads
        key: ${{ steps.native-deps.outputs.cache-primary-key }}
    - name: Compile the locked native core
      env:
        ABI: ${{ matrix.abi }}
        TARGET: ${{ matrix.target }}
        FEATURES: ${{ matrix.features }}
        SYSROOT: ${{ matrix.sysroot }}
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libclang-dev nasm ninja-build cmake pkg-config
        cargo install cargo-ndk --version 3.5.4 --locked
        cd homedesk-core/client
        # Bindgen must use Bionic target headers, independently of cargo-ndk's C compiler.
        export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/$SYSROOT -D__ANDROID_API__=26"
        cargo ndk --platform 26 --target "$TARGET" build --locked --release --features "$FEATURES" --lib
        mkdir -p "$GITHUB_WORKSPACE/native-artifact/jniLibs/$ABI"
        cp "target/$TARGET/release/liblibrustdesk.so" "$GITHUB_WORKSPACE/native-artifact/jniLibs/$ABI/librustdesk.so"
        cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$SYSROOT/libc++_shared.so" "$GITHUB_WORKSPACE/native-artifact/jniLibs/$ABI/"
        cd flutter
        flutter pub get --enforce-lockfile
        cd ../../..
        python3 homedesk-core/scripts/collect-native-materials.py
        mkdir -p "native-artifact/material-input/$ABI"
        cp -R homedesk-core/material-input/. "native-artifact/material-input/$ABI/"
        find "$ANDROID_NDK_HOME" -maxdepth 2 -type f -name '*NOTICE*' -exec cp {} "native-artifact/material-input/$ABI/" \;
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: homedesk-native-${{ matrix.abi }}
        path: native-artifact/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
  debug:
    name: Android app and encrypted-storage test packages
    runs-on: ubuntu-24.04
    needs:
    - bridge
    - native
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: 1.96.0
        components: rustfmt
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: 3.24.5
        cache: true
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - name: Install pinned Android SDK/NDK
      run: |
        bash scripts/setup-homedesk-sdk.sh
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: homedesk-bridge
        path: homedesk-core/client
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: homedesk-native-*
        path: imported/native
        merge-multiple: true
    - name: Build and analyze the shared product
      run: |
        cp -R imported/native/jniLibs homedesk-core/client/flutter/android/app/src/main/
        cd homedesk-core/client/flutter
        flutter pub get --enforce-lockfile
        flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
        flutter test --no-pub test/homedesk_devices_test.dart test/homedesk_dashboard_test.dart test/homedesk_advanced_test.dart test/homedesk_services_test.dart test/homedesk_mobile_test.dart
        flutter build apk --debug --target-platform android-arm64,android-x64
        cd android
        # The test task rebuilds the app; keep Flutter's selected ABIs instead of its arm32 default.
        ./gradlew --no-daemon :app:assembleDebugAndroidTest -Ptarget-platform=android-arm64,android-x64
        cd "$GITHUB_WORKSPACE"
        python3 scripts/verify-homedesk-apk.py homedesk-core/client/flutter/build/app/outputs/flutter-apk/app-debug.apk --unsigned-debug
        mkdir -p outputs/android-debug
        cp homedesk-core/client/flutter/build/app/outputs/flutter-apk/app-debug.apk outputs/android-debug/
        cp homedesk-core/client/flutter/build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk outputs/android-debug/
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: homedesk-android-debug
        path: outputs/android-debug/
        if-no-files-found: error
  instrumentation:
    name: AndroidKeyStore and startup (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    needs: debug
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api:
        - 26
        - 35
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: homedesk-android-debug
        path: outputs/android-debug
    - name: Exercise real AndroidKeyStore and app startup
      env:
        ANDROID_API: ${{ matrix.api }}
      run: bash scripts/homedesk-emulator-check.sh
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() }}
      with:
        name: homedesk-android-runtime-${{ matrix.api }}
        path: instrumentation-evidence/
        if-no-files-found: error
  signed:
    name: Sign unchanged Android application identity
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    needs:
    - debug
    - instrumentation
    - repository
    environment: android-release
    timeout-minutes: 40
    env:
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: 1.96.0
        components: rustfmt
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: 3.24.5
        cache: true
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - name: Install pinned Android SDK/NDK
      run: |
        bash scripts/setup-homedesk-sdk.sh
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: homedesk-bridge
        path: homedesk-core/client
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: homedesk-native-*
        path: imported/native
        merge-multiple: true
    - name: Build once with the existing release certificate
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      run: |
        export ANDROID_RELEASE_STORE_FILE="$RUNNER_TEMP/homedesk-release.jks"
        trap 'rm -f -- "$ANDROID_RELEASE_STORE_FILE"' EXIT
        python3 - <<'PY'
        import base64, os
        from pathlib import Path
        path=Path(os.environ['ANDROID_RELEASE_STORE_FILE'])
        path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'],validate=True))
        path.chmod(0o600)
        PY
        cp -R imported/native/jniLibs homedesk-core/client/flutter/android/app/src/main/
        cd homedesk-core/client/flutter
        flutter pub get --enforce-lockfile
        flutter build apk --release --target-platform android-arm64,android-x64
        cd "$GITHUB_WORKSPACE"
        mkdir -p products material-input
        cp homedesk-core/client/flutter/build/app/outputs/flutter-apk/app-release.apk products/NestLink-Android-13.0.0.apk
        cp -R imported/native/material-input/. material-input/
        python3 scripts/verify-homedesk-apk.py products/NestLink-Android-13.0.0.apk
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: homedesk-android-runtime-*
        path: material-input/android-runtime
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: homedesk-android
        include-hidden-files: true
        path: |-
          products/*
          material-input/**
        if-no-files-found: error
        retention-days: 30
  repository:
    name: Pinned shared-source and API ownership
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        fetch-depth: 0
    - run: |-
        python3 scripts/check-homedesk-source.py
        python3 -m compileall -q scripts
        git diff --check
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
    - bridge
    - native
    - debug
    - instrumentation
    - signed
    - repository
    steps:
    - env:
        RESULTS: ${{ toJSON(needs) }}
        PR: ${{ github.event_name == 'pull_request' }}
      run: |
        python3 - <<'PY'
        import json,os
        results=json.loads(os.environ['RESULTS'])
        failed={k:v['result'] for k,v in results.items() if v['result']!='success' and not (k=='signed' and v['result']=='skipped' and os.environ['PR']=='true')}
        if failed: raise SystemExit(str(failed))
        PY
