name: Android CI
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  merge_group: null
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Sign arm64 and x64 APKs once. This does not publish a Release.
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-candidate:
    name: Signed Android candidate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_candidate }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/android-candidate.yml
    secrets: inherit
  android:
    name: Android client
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.release_candidate }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Verify the pinned Gradle wrapper
      run: |
        set -euo pipefail
        echo '498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
        grep -Fxq 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip' gradle/wrapper/gradle-wrapper.properties
        grep -Fxq 'distributionSha256Sum=d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab' gradle/wrapper/gradle-wrapper.properties
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
        cache-dependency-path: |
          **/*.gradle*
          gradle.properties
          gradle/wrapper/gradle-wrapper.properties
    - name: Test, lint, and assemble the unsigned debug client
      run: |
        source scripts/install-native-tools.sh
        python3 scripts/build-remote-native.py
        ./gradlew --no-daemon -PremoteNativeRoot="$PWD/.cache/remote-native" test lint assembleDebug assembleDebugAndroidTest
    - name: Share compiled debug instrumentation packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: android-debug-instrumentation
        path: app/build/outputs/apk/
        if-no-files-found: error
    - name: Require generated Android binaries to remain untracked
      shell: bash
      run: |
        set -euo pipefail
        tracked=$(git ls-files -- '*.apk' '*.aab' '*.aar' '*.jks' '*.keystore' '*.so')
        if [ -n "$tracked" ]; then
          echo 'Generated Android binaries or signing stores must not be committed:' >&2
          printf '%s\n' "$tracked" >&2
          exit 1
        fi
        git diff --exit-code
  instrumentation:
    name: Android runtime (API ${{ matrix.api }})
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: android-debug-instrumentation
        path: app/build/outputs/apk/
    - name: Exercise AndroidKeyStore and management UI on Android
      env:
        ANDROID_API: ${{ matrix.api }}
      run: bash scripts/emulator-check.sh
    - name: Preserve Android runtime evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: android-runtime-api-${{ matrix.api }}
        path: instrumentation-evidence/
        if-no-files-found: error
  repository:
    name: Repository boundaries
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - run: |
        python3 scripts/check-repository.py
        python3 scripts/build-remote-native.py --verify-only
    - name: Check release policy
      run: |
        python3 -m unittest discover -s scripts -p 'test_*.py'
  dependency-review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
      with:
        fail-on-severity: moderate
  quality-gate:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_candidate && 'Candidate Build Gate' || 'Quality Gate' }}
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
    - release-candidate
    - android
    - instrumentation
    - repository
    - dependency-review
    steps:
    - name: Require all component checks
      env:
        RESULTS: ${{ toJSON(needs) }}
        CANDIDATE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.release_candidate }}
      run: |
        python3 - <<'PY'
        import json, os
        results = json.loads(os.environ['RESULTS'])
        candidate = os.environ['CANDIDATE_RUN'] == 'true'
        required = {'repository', 'release-candidate'} if candidate else {'android', 'instrumentation', 'repository'}
        failed = {k:v['result'] for k,v in results.items() if (k in required and v['result'] != 'success') or v['result'] not in ('success', 'skipped')}
        if not required.issubset(results): raise SystemExit('Missing required job results')
        if failed: raise SystemExit(str(failed))
        print('Candidate build checks passed; device acceptance remains separate' if candidate else 'All component checks passed')
        PY
